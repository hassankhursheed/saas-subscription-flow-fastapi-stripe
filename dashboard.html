<!DOCTYPE html>
<html lang="en">

<head>
    <title>Your Subscription</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-page">
        <div class="confirmation-wrapper">
            <div class="confirmation-header">
                <h1>Welcome back, {{FULL_NAME}}!</h1>
                <p class="confirmation-subtitle">You already have a subscription. Here are its details.</p>
            </div>

            <div class="confirmation-details">
                <div class="detail-card">
                    <svg class="detail-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <div class="detail-content">
                        <span class="detail-label">Package</span>
                        <span class="detail-value">{{PACKAGE_NAME}}</span>
                    </div>
                </div>

                <div class="detail-card">
                    <svg class="detail-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" />
                        <path fill-rule="evenodd"
                            d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z"
                            clip-rule="evenodd" />
                    </svg>
                    <div class="detail-content">
                        <span class="detail-label">Price</span>
                        <span class="detail-value">${{PRICE}} / month</span>
                    </div>
                </div>

                <div class="detail-card">
                    <svg class="detail-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                            clip-rule="evenodd" />
                    </svg>
                    <div class="detail-content">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">{{STATUS}}</span>
                    </div>
                </div>

                <div class="detail-card">
                    <svg class="detail-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"
                            clip-rule="evenodd" />
                    </svg>
                    <div class="detail-content">
                        <span class="detail-label">Subscribed On</span>
                        <span class="detail-value">{{SUBSCRIBED_ON}}</span>
                    </div>
                </div>
            </div>

            <div class="confirmation-actions">
                <a href="/" class="btn btn-primary">
                    <svg class="btn-icon-left" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                    </svg>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </div>

    <script src="/static/scripts.js"></script>
</body>

</html>
